<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mapjak - Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* === Global Reset === */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Manrope', sans-serif;
      background: linear-gradient(to bottom right, #e0f7fa, #ffffff);
    }

    /* === Layout === */
    .site-header {
      background: linear-gradient(to right, #b3e5fc, #e1f5fe);
      color: #333;
      padding: 0.5rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-bottom: 1px solid #b3e5fc;
    }
    .site-header h1 { margin: 0; font-weight: 400; font-size: 1.2rem; }

    nav { display: flex; gap: 0.5rem; }

    .nav-btn {
      background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0.2));
      border: none;
      color: #333;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
      transition: background 0.3s, transform 0.1s;
    }
    .nav-btn:hover {
      background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
      transform: translateY(-1px);
    }

    #map { height: calc(100vh - 48.5px); width: 100%; }

    /* === Popups & Markers === */
    .leaflet-popup-content { margin: 0; }
    .popup-card {
      font-family: 'Segoe UI', 'Manrope', sans-serif;
      max-width: 300px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .popup-img { width: 100%; display: block; border-bottom: 1px solid #ddd; cursor: pointer; }
    .popup-details { padding: 0.3rem 0.8rem; }
    .popup-details p { margin: 0.2rem 0; font-size: 0.8rem; line-height: 1.2; }

    .custom-pin {
      width: 30px; height: 30px;
      border-radius: 6px; border: 2px solid #888;
      background-size: cover; background-position: center;
      box-shadow: 0 0 4px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .leaflet-div-icon {
      background: none !important;
      border: none !important;
    }

    /* Cluster marker styling */
    .custom-cluster { background: none; }
    .aero-marker {
      position: relative; width: 50px; height: 65px;
      background: linear-gradient(to bottom, #53b2f9, #0c72c5);
      box-shadow: 0 4px 10px rgba(0, 80, 180, 0.5),
                  inset 0 -5px 8px rgba(0, 0, 0, 0.25),
                  inset 0 5px 8px rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255,255,255,0.2);
      clip-path: path('M 25 0 C 45 0, 50 22, 25 65 C 0 22, 5 0, 25 0 Z');
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .aero-marker:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 12px rgba(0, 100, 255, 0.5),
                  inset 0 -5px 8px rgba(0, 0, 0, 0.3),
                  inset 0 5px 8px rgba(255, 255, 255, 0.3);
      cursor: pointer;
    }
    .aero-marker-inner {
      color: white; font-weight: 600; font-size: 16px;
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 10px; width: 100%; height: 100%;
      pointer-events: none;
    }

    /* === Buttons and Toasts === */
    .delete-btn {
      background: linear-gradient(to bottom, #ff6f61, #f44336);
      color: #fff; border: none;
      padding: 0.2rem 0.5rem; border-radius: 9999px;
      font-size: 0.75rem; cursor: pointer;
      margin-top: 0.4rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 1px 2px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    .delete-btn:hover {
      background: linear-gradient(to bottom, #f44336, #e53935);
      transform: translateY(-1px);
    }

    .toast {
      position: fixed; top: 30px; left: 50%;
      transform: translateX(-50%);
      background: #333; color: #fff;
      padding: 0.75rem 1rem; border-radius: 6px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      font-size: 0.9rem; z-index: 9999;
    }
    .toast.show { opacity: 1; }
    .toast.hide { opacity: 0; }

    /* === Modal === */
    .modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%;
             background-color: rgba(0,0,0,0.5); padding-top: 60px; }
    .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90%; border-radius: 6px; }
    .close { position: absolute; top: 20px; right: 35px; font-size: 40px; font-weight: bold; color: #f1f1f1; cursor: pointer; }
    .close:hover { color: #bbb; }

    @media (max-width: 600px) {
      .site-header { flex-direction: column; gap: 0.5rem; padding: 1rem; }
      .site-header h1 { display: none; }
      nav { width: 100%; justify-content: center; flex-wrap: wrap; gap: 0.5rem; }
      .nav-btn { flex: 1; font-size: 0.9rem; padding: 0.4rem 0.75rem; }
    }
  </style>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Mapjak</h1>
    <nav>
      <button onclick="window.location.href='/upload'" class="nav-btn">Upload</button>
      <button onclick="window.location.href='/map'" class="nav-btn">Map</button>
      <button onclick="window.location.href='/logout'" class="nav-btn">Log Out</button>
    </nav>
  </header>

  <div id="map"></div>

  <!-- Toast and Modal -->
  <div id="toast" class="toast"></div>
  <div id="imgModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImage">
  </div>

  <script>
    // === Modal + Toast Helpers ===
    const modal = document.getElementById('imgModal');
    const modalImg = document.getElementById('modalImage');
    const toast = document.getElementById('toast');

    function showModal(src) {
      modal.style.display = "block";
      modalImg.src = src;
    }
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function deletePhoto(id) {
      fetch(`/delete/${id}`, { method: 'POST', credentials: 'same-origin' })
        .then(res => res.text().then(text => {
          showToast(text || 'Something went wrong.');
          if (res.ok) setTimeout(() => location.reload(), 2500);
        }))
        .catch(() => showToast('Error deleting photo.'));
    }

    window.addEventListener('load', () => {
      const map = L.map('map').setView([0, 0], 2);

      // User icons
      const userIcons = {
        "Jack Escowitz": L.divIcon({ html: `<div class="custom-pin" style="background-image: url('/icons/jack-escowitz-pfp.png')"></div>` }),
        "Austin Zhao": L.divIcon({ html: `<div class="custom-pin" style="background-image: url('/icons/austin-zhao-pfp.png')"></div>` }),
        "Matthew Beissel": L.divIcon({ html: `<div class="custom-pin" style="background-image: url('/icons/matthew-beissel-pfp.png')"></div>` }),
        "Yash Sriram": L.divIcon({ html: `<div class="custom-pin" style="background-image: url('/icons/yash-sriram-pfp.png')"></div>` }),
      };
      const defaultIcon = L.icon({ iconUrl: '/icons/default-pin.png', iconSize: [30,30], iconAnchor: [15,30], popupAnchor: [0,-30] });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors & Carto', subdomains: 'abcd', maxZoom: 20
      }).addTo(map);

      // Load photo markers
      fetch('/uploads')
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
          const bounds = L.latLngBounds();
          const markers = L.markerClusterGroup({
            spiderLegPolylineOptions: { weight: 0 },
            maxClusterRadius: 30,
            showCoverageOnHover: false,
            iconCreateFunction: c => {
              let count = c.getChildCount();
              return L.divIcon({
                html: `<div class="aero-marker"><div class="aero-marker-inner">${count>999?'999+':count}</div></div>`,
                className: 'custom-cluster',
                iconSize: [44, 60],
                iconAnchor: [22, 60],
              });
            }
          });

          data.forEach(rec => {
            if (!rec.lat || !rec.lon) return;
            const icon = userIcons[rec.username] || defaultIcon;
            const popup = `
              <div class="popup-card">
                <img src="${rec.filepath}" alt="${rec.originalname}" class="popup-img" onclick="showModal('${rec.filepath}')">
                <div class="popup-details">
                  <p><strong>Date:</strong> ${rec.date_taken ? new Date(rec.date_taken).toLocaleDateString() : 'Unknown'}</p>
                  <p><strong>Uploaded by:</strong> ${rec.username}</p>
                  <button onclick="deletePhoto('${rec.id}')" class="delete-btn">Delete</button>
                </div>
              </div>`;
            markers.addLayer(L.marker([rec.lat, rec.lon], { icon }).bindPopup(popup));
            bounds.extend([rec.lat, rec.lon]);
          });

          map.addLayer(markers);
          if (bounds.isValid()) map.fitBounds(bounds, { padding: [30,30] });
        })
        .catch(() => showToast('Could not load uploads.'));

      document.querySelector('.close').onclick = () => modal.style.display = "none";
      modal.onclick = e => { if (e.target === modal) modal.style.display = "none"; };
    });
  </script>
</body>
</html>
