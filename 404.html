<!DOCTYPE html>
<html>
<head>
  <title>Mapjak - 404 Not Found</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', 'Manrope', 'Noto Sans', 'Arial Rounded MT Bold', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to bottom right, #e0f7fa, #ffffff);
    }

    .site-header {
      background: linear-gradient(to right, #b3e5fc, #e1f5fe);
      color: #333;
      padding: 0.5rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-bottom: 1px solid #b3e5fc;
    }

    .site-header h1 {
      margin: 0;
      font-weight: 400;
      font-size: 1.2rem;
    }

    .nav-btn {
      background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0.2));
      border: none;
      color: #333;
      padding: 0.5rem 1rem;
      margin-left: 0.5rem;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
      transition: background 0.3s, transform 0.1s;
    }

    .nav-btn:hover {
      background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
      transform: translateY(-1px);
    }

    main {
      padding: 2rem;
    }

    .error-sign {
      background: rgba(255, 255, 255, 0.6); 
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      margin: 2rem auto;
      padding: 2rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      .site-header {
          flex-direction: column;
          align-items: center;
          gap: 0.5rem;
          padding: 1rem;
      }

      .site-header h1 {
          display: none;
      }

      nav {
          justify-content: center;
          width: 100%;
          display: flex;
          flex-wrap: wrap;
          gap: 0.5rem;
      }

      .nav-btn {
          font-size: 0.9rem;
          padding: 0.4rem 0.75rem;
          text-align: center;
          max-width: 200px;
      }

    }

  </style>
</head>
<body>
  <header class="site-header">
    <h1>Mapjak</h1>
    <nav>
      <button onclick="window.location.href='/'" class="nav-btn">Home</button>
    </nav>
  </header>
  <main>
    <div class="error-sign">
      <h1>404 - Page Not Found</h1>
    </div>
  </main>
</body>
</html>
