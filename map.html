<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Mapjak - Map</title>

    <!--Must include Leaflet CSS in head-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="""
    />

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        /* Full page map */
        #map {
            height: calc(100vh - 48.5px);
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', 'Manrope', 'Noto Sans', 'Arial Rounded MT Bold', Arial, sans-serif;
            margin: 0;
            background: linear-gradient(to bottom right, #e0f7fa, #ffffff);
        }

        .site-header {
            background: linear-gradient(to right, #b3e5fc, #e1f5fe);
            color: #333;
            padding: 0.5rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-bottom: 1px solid #b3e5fc;
        }

        .site-header h1 {
            margin: 0;
            font-weight: 400;
            font-size: 1.2rem;
        }

        .nav-btn {
            background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0.2));
            border: none;
            color: #333;
            padding: 0.5rem 1rem;
            margin-left: 0.5rem;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
            transition: background 0.3s, transform 0.1s;
        }

        .nav-btn:hover {
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
            transform: translateY(-1px);
        }

    </style>
    
    <!-- Leaflet's JavaScript file -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>
</head>
<body>
    <header class="site-header">
        <h1>Mapjak</h1>
        <nav>
            <button onclick="window.location.href='/upload'" class="nav-btn">Upload</button>
            <button onclick="window.location.href='/map'" class="nav-btn">Map</button>
            <button onclick="window.location.href='/logout'" class="nav-btn">Log Out</button>
        </nav>
    </header>
    
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script>
        // Initialize the map
        const map = L.map('map').setView([0, 0], 2);

        // Add a tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Fetch uploads JSON
        fetch('/uploads')
            // Parses response from server into JS array
            .then(response => response.json())
            .then(data => {

                // Create an empty bounds box
                const bounds = L.latLngBounds();

                data.forEach(record => {
                    if (record.lat && record.lon) {
                        const marker = L.marker([record.lat, record.lon])
                            .addTo(map)
                            .bindPopup(`
                                <img src="/uploads/${record.filename}"
                                    alt="${record.originalname}"
                                    style="width: 300px; height: auto; margin-top: 5px;"><br>
                                <details>
                                    <summary>Show Details</summary>
                                    File name: ${record.originalname}<br>
                                    Date taken: ${record.date_taken ? new Date(record.date_taken).toLocaleDateString() : 'Unknown'}<br>
                                    Uploaded by: ${record.username}
                                </details>
                            `);
                        bounds.extend([record.lat, record.lon]);
                    }
                });

                if (bounds.isValid()) {
                    map.fitBounds(bounds);
                }
            })
            .catch(error => console.error('Error fetching uploads:', error));
    </script>
</body>
</html>
