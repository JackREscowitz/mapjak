<!DOCTYPE html>
<html lang="en">
<head>
    <title>Revres Tfarcenim</title>
</head>
<body>
    <form id="loginForm" action="/login" method="POST" enctype="application/x-www-form-urlencoded">
        <input type="text" name="username" placeholder="Username"><br>
        <input type="password" name="password" placeholder="Password"><br><br>
        <input type="submit" value="Log In">
    </form>

    <p id="logInFailMessage"></p>

    <script>
        const form = document.getElementById("loginForm");
        const logInFailMessage = document.getElementById("logInFailMessage");
        form.addEventListener("submit", async (event) => {
            event.preventDefault(); // Stop the normal submit

            const formData = new FormData(form);
            const response = await fetch('/login', {
                method: 'POST',
                body: new URLSearchParams(formData)
            });

            const result = await response.text();

            if (result === 'success') {
                window.location.href = '/index.html';
            } else {
                logInFailMessage.textContent = result;
            }
        });
    </script>
</body>
</html>
