name: Monthly Backup

on:
  schedule:
    # Runs at 3am UTC on the first of each month
    - cron: '0 3 1 * *'

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Install Postgres client & AWS CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client awscli

    - name: Run DB Backup
      run: bash backup_db.sh

    - name: Run S3 Backup
      run: bash backup_s3.sh

    - name: Archive and upload backup artifact
      uses: actions/upload-artifact@v4
      with:
        name: mapjak-monthly-backup
        path: backups/
